openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CommandCentre OS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: members
  - name: segments
  - name: messaging
  - name: field-ops
  - name: volunteers
  - name: surveys
  - name: events
  - name: intelligence
  - name: campaign-plan
  - name: kol
  - name: insights
  - name: social

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Campaign overview stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Recent campaign activity feed
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── Members ──────────────────────────────────────────────────────────────
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List campaign members/contacts
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: ward
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
    post:
      operationId: createMember
      tags: [members]
      summary: Add a new member/contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get member details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /members/stats:
    get:
      operationId: getMemberStats
      tags: [members]
      summary: Member database statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberStats"

  # ─── Audience Segments ────────────────────────────────────────────────────
  /segments:
    get:
      operationId: listSegments
      tags: [segments]
      summary: List audience segments
      responses:
        "200":
          description: Segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Segment"
    post:
      operationId: createSegment
      tags: [segments]
      summary: Create an audience segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"

  /segments/{id}:
    get:
      operationId: getSegment
      tags: [segments]
      summary: Get segment details + member count
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
    patch:
      operationId: updateSegment
      tags: [segments]
      summary: Update a segment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
    delete:
      operationId: deleteSegment
      tags: [segments]
      summary: Delete a segment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ─── Messaging Campaigns ──────────────────────────────────────────────────
  /messages:
    get:
      operationId: listCampaigns
      tags: [messaging]
      summary: List messaging campaigns
      parameters:
        - name: channel
          in: query
          schema: { type: string, enum: [sms, whatsapp, email] }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageCampaign"
    post:
      operationId: createCampaign
      tags: [messaging]
      summary: Create a messaging campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCampaignInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCampaign"

  /messages/{id}:
    get:
      operationId: getCampaign
      tags: [messaging]
      summary: Get campaign details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCampaign"
    patch:
      operationId: updateCampaign
      tags: [messaging]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCampaignUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCampaign"
    delete:
      operationId: deleteCampaign
      tags: [messaging]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /messages/{id}/send:
    post:
      operationId: sendCampaign
      tags: [messaging]
      summary: Send / schedule a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCampaign"

  /messages/stats:
    get:
      operationId: getMessagingStats
      tags: [messaging]
      summary: Overall messaging delivery stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingStats"

  # ─── Field Operations ─────────────────────────────────────────────────────
  /field-ops/sessions:
    get:
      operationId: listCanvassSessions
      tags: [field-ops]
      summary: List canvass sessions
      parameters:
        - name: ward
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvassSession"
    post:
      operationId: createCanvassSession
      tags: [field-ops]
      summary: Create a new canvass session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvassSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvassSession"

  /field-ops/sessions/{id}:
    get:
      operationId: getCanvassSession
      tags: [field-ops]
      summary: Get canvass session details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvassSession"

  /field-ops/visits:
    get:
      operationId: listCanvassVisits
      tags: [field-ops]
      summary: List door-knock visit logs
      parameters:
        - name: sessionId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvassVisit"
    post:
      operationId: logCanvassVisit
      tags: [field-ops]
      summary: Log a door-knock visit outcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvassVisitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvassVisit"

  /field-ops/coverage:
    get:
      operationId: getFieldCoverage
      tags: [field-ops]
      summary: Ward coverage overview
      responses:
        "200":
          description: Coverage by ward
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WardCoverage"

  # ─── Volunteers ───────────────────────────────────────────────────────────
  /volunteers:
    get:
      operationId: listVolunteers
      tags: [volunteers]
      summary: List volunteers
      parameters:
        - name: ward
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Volunteers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Volunteer"
    post:
      operationId: createVolunteer
      tags: [volunteers]
      summary: Add a volunteer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volunteer"

  /volunteers/register:
    post:
      operationId: registerVolunteer
      tags: [volunteers]
      summary: Public volunteer self-registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerRegistration"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volunteer"

  /volunteers/{id}:
    get:
      operationId: getVolunteer
      tags: [volunteers]
      summary: Get volunteer details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Volunteer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volunteer"
    patch:
      operationId: updateVolunteer
      tags: [volunteers]
      summary: Update a volunteer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volunteer"

  /volunteers/assignments:
    get:
      operationId: listVolunteerAssignments
      tags: [volunteers]
      summary: List volunteer ward assignments
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolunteerAssignment"
    post:
      operationId: createVolunteerAssignment
      tags: [volunteers]
      summary: Assign volunteer to a ward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerAssignmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerAssignment"

  # ─── Surveys ──────────────────────────────────────────────────────────────
  /surveys:
    get:
      operationId: listSurveys
      tags: [surveys]
      summary: List surveys
      responses:
        "200":
          description: Surveys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Survey"
    post:
      operationId: createSurvey
      tags: [surveys]
      summary: Create a survey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"

  /surveys/{id}:
    get:
      operationId: getSurvey
      tags: [surveys]
      summary: Get survey with questions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Survey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"

  /surveys/{id}/responses:
    get:
      operationId: getSurveyResponses
      tags: [surveys]
      summary: Get survey responses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveyResponse"
    post:
      operationId: submitSurveyResponse
      tags: [surveys]
      summary: Submit a survey response
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyResponseInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyResponse"

  # ─── Events ───────────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List campaign events
      parameters:
        - name: upcoming
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignEvent"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignEvent"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignEvent"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignEventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignEvent"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ─── Insights (Opinion Polling) ──────────────────────────────────────────
  /insights/polls:
    get:
      operationId: listInsightPolls
      tags: [insights]
      summary: List all insight polls
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Polls list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightPoll"
    post:
      operationId: createInsightPoll
      tags: [insights]
      summary: Create a new poll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightPollInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightPoll"

  /insights/polls/{id}:
    get:
      operationId: getInsightPoll
      tags: [insights]
      summary: Get poll details with questions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightPoll"
    patch:
      operationId: updateInsightPoll
      tags: [insights]
      summary: Update a poll
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightPollUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightPoll"
    delete:
      operationId: deleteInsightPoll
      tags: [insights]
      summary: Delete a poll
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /insights/polls/{id}/publish:
    post:
      operationId: publishInsightPoll
      tags: [insights]
      summary: Publish a poll and generate share token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightPoll"

  /insights/polls/{id}/questions:
    get:
      operationId: listInsightQuestions
      tags: [insights]
      summary: List questions for a poll
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightQuestion"
    post:
      operationId: createInsightQuestion
      tags: [insights]
      summary: Add a question to a poll
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightQuestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightQuestion"

  /insights/polls/{id}/questions/{qid}:
    patch:
      operationId: updateInsightQuestion
      tags: [insights]
      summary: Update a question
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: qid
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightQuestionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightQuestion"
    delete:
      operationId: deleteInsightQuestion
      tags: [insights]
      summary: Delete a question
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: qid
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /insights/polls/{id}/results:
    get:
      operationId: loadInsightResults
      tags: [insights]
      summary: Get aggregated poll results
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightResults"

  /insights/polls/{id}/responses:
    get:
      operationId: loadInsightResponses
      tags: [insights]
      summary: List raw responses for a poll
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightResponse"

  /insights/polls/{id}/ai-summary:
    post:
      operationId: generateInsightAiSummary
      tags: [insights]
      summary: Generate GPT-4 AI summary for poll results
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: AI Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightAiSummary"
    get:
      operationId: getInsightAiSummary
      tags: [insights]
      summary: Get cached AI summary for a poll
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: AI Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightAiSummary"

  /insights/polls/{id}/questions/{qid}/sentiment:
    post:
      operationId: analyzeInsightSentiment
      tags: [insights]
      summary: Run GPT-4 sentiment analysis on open-ended answers
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: qid
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sentiment analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightAiSummary"

  /insights/polls/{id}/trend:
    get:
      operationId: loadInsightTrend
      tags: [insights]
      summary: Get trend data for recurring questions
      parameters:
